name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # CI never receives SMTP credentials and never enables or submits the form.

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified 1.3.1 source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$version" != '1.3.1' ]; then exit 0; fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo 'Tag already exists; refusing to replace it.'
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "GOL Web Studio $version — LexRadar" \
            --notes-file "docs/releases/$version.md"
